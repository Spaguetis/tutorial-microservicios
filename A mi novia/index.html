<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valentina, una pregunta para ti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Quicksand:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-1" aria-hidden="true"></div>
    <div class="bg-shape bg-shape-2" aria-hidden="true"></div>
    <button class="audio-toggle" id="audioToggle" aria-pressed="false">
      Activar sonido
    </button>

    <main class="card" id="card">
      <p class="eyebrow">Solo para Valentina</p>
      <h1 id="title">Valentina, ¿quieres ser mi novia?</h1>
      <p class="subtitle" id="subtitle">
        Quiero cuidarte, respetarte y estar para ti en lo bonito y en lo dificil.
      </p>

      <div class="button-zone" id="buttonZone">
        <button class="btn btn-yes" id="yesBtn">Si, obvio</button>
        <button class="btn btn-no" id="noBtn">No</button>
      </div>

      <p class="hint" id="hint">Tip: intenta presionar "No"... si te deja.</p>
    </main>

    <section class="success hidden" id="successPanel" aria-live="polite">
      <div class="success-scene">
        <img
          src="romantic-scene.svg"
          alt="Ilustracion romantica con corazones"
          class="scene-image"
        />
        <div class="scene-copy">
          <h2>Gracias por decir que si</h2>
          <p>
            Prometo amor bonito, cuidado real, respeto y un abrazo seguro en cada etapa.
          </p>
        </div>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
